# Alt text, captions and credits for photos in src/assets/photos/.
# The key (id) is the image filename without ".jpg".
#
# alt:     describes the image for screen readers (required)
# caption: shown under the image; replace "TBD" with your own text,
#          or set it to "" to show no caption
# credit:  (optional) photographer, shown after the caption

